        - heading "Adatkezelési tájékoztató" [level=2] [ref=f5e44]
        - paragraph [ref=f5e45]: A weboldal nem használ sütiket, nem futtat analitikát, és nem ad át adatot harmadik félnek. Nincs regisztráció és nincs szerveroldali adatbázis.
        - heading "Böngészőben tárolt játékmentés" [level=3] [ref=f5e46]
        - paragraph [ref=f5e47]: Ha elkezded az 1. fejezetet, a neved és a döntéseid a saját böngésződ localStorage tárolójába kerülnek, hogy folytatni tudd. Ez az adat nem hagyja el a gépedet, hozzánk nem jut el. A böngésző adatainak törlésével bármikor eltávolítható, vagy a játékban az Újrakezdés gombbal.
        - heading "Betűtípusok és külső kérések" [level=3] [ref=f5e48]
        - paragraph [ref=f5e49]: A betűtípusokat saját kiszolgálóról töltjük be, így az oldal megtekintésekor nem indul kérés a Google vagy más külső szolgáltató felé. A GitHub- és Ko-fi-hivatkozások csak akkor nyílnak meg, ha rájuk kattintasz.
        - heading "Jogaid" [level=3] [ref=f5e50]
        - paragraph [ref=f5e51]: Mivel nem gyűjtünk és nem tárolunk rólad személyes adatot, nincs mit kiadnunk, helyesbítenünk vagy törölnünk. Kérdés esetén írj a fenti címre.
        - heading "Szerzői jog" [level=2] [ref=f5e52]
        - paragraph [ref=f5e53]: A Fityesz Krónika szövegét és a weboldalt az alkotók készítették. A Saira Stencil One betűtípus SIL Open Font License 1.1 alatt érhető el.
        - paragraph [ref=f5e54]: A Fityesz Krónika szatirikus fikció. Nem valós személyeket vagy szervezeteket ábrázol, és nem használja egyetlen létező párt logóját, névjegyét vagy arculatát sem.
